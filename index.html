   <div class="username"></div>

<script>
// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyDFKC...",
  authDomain: "makcek-ngobrol.firebaseapp.com",
  projectId: "makcek-ngobrol",
  storageBucket: "makcek-ngobrol.firebasestorage.app",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
 const currentUser = localStorage.getItem('username');
const role = localStorage.getItem('role');

const isAdmin = role === 'admin';
// ESCAPE HTML (ANTI XSS)
function escapeHTML(text){
  return text.replace(/[&<>"']/g, m => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[m]));
}


// LOAD USER
window.onload = () => {
   const username = localStorage.getItem('username');
  const avatar = localStorage.getItem('avatar');
  if(avatar){
    document.querySelectorAll('.avatar').forEach(el=>{
      el.style.backgroundImage = `url(${avatar})`;
    });
     if(username){
    document.querySelectorAll('.username').forEach(el=>{
      el.innerText = username;
    });
  }
  if (!username || username.trim() === "") {
    setTimeout(() => {
      openSettings();
    }, 500);
  }
     const topAvatar = document.querySelector('.post-box .avatar');
    if(topAvatar){
      topAvatar.style.backgroundImage = `url(${avatar})`;
    }
  }
 
};
async function uploadToCloudinary(file){

  let uploadFile = file;

  // ✅ compress hanya kalau image
  if(file.type.startsWith("image/")){
    uploadFile = await compressImage(file, 0.7, 1280);
  }

  const formData = new FormData();
  formData.append("file", uploadFile);
  formData.append("upload_preset", "mini_fb_avatar");

  const res = await fetch("https://api.cloudinary.com/v1_1/dutbbao5r/upload", {
    method: "POST",
    body: formData
  });

  const data = await res.json();
  return data.secure_url;
}
  // compres
function compressImage(file, quality = 0.7, maxWidth = 1280){
  return new Promise((resolve) => {
    const reader = new FileReader();

    reader.onload = function(e){
      const img = new Image();

      img.onload = function(){
        const canvas = document.createElement("canvas");

        const scale = Math.min(maxWidth / img.width, 1);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        canvas.toBlob((blob) => {
          resolve(blob);
        }, "image/jpeg", quality);
      };

      img.src = e.target.result;
    };

    reader.readAsDataURL(file);
  });
}

// RENDER
function renderFeed(snapshot){
  const feed = document.getElementById('feed');
  feed.innerHTML = '';

  snapshot.forEach(doc=>{
    const p = doc.data();
    const currentUser = localStorage.getItem('username');
    const isOwner = p.user === currentUser;
    const isAdmin = role === 'admin';
    let media = '';
    if(p.fileUrl){
      if(p.fileUrl.match(/\.(jpg|jpeg|png|gif|webp)/i)){
        media = `<img src="${p.fileUrl}">`;
      } else {
        media = `<video src="${p.fileUrl}" controls></video>`;
      }
    }

    const time = p.timestamp?.toDate().toLocaleString() || '...';

    const div = document.createElement('div');
    div.className = 'post';

    div.innerHTML = `
      <div class="post-header">
        <div class="avatar" style="background-image:url('${p.avatar || ""}')"></div>
        <div style="margin-left:8px;">
          <div class="post-user">${p.user}</div>
          <div class="post-time">${time}</div>
        </div>
      </div>

      <div>${escapeHTML(p.content)}</div>
      ${media}

      <div>👍 ${p.likes?.length || 0}</div>

      <div class="post-actions">
        <button onclick="toggleLike('${doc.id}')">👍 Suka</button>
        <button onclick="document.getElementById('c${doc.id}').focus()">💬 Komentar</button>
        ${(isOwner || isAdmin) 
  ? `<button onclick="deletePost('${doc.id}')">🗑 Hapus</button>` 
  : ""}
      </div>

      
        
      

        <div class="comment-input">
          <input placeholder="Tulis komentar..." id="c${doc.id}">
          <button onclick="addComment('${doc.id}')">➤</button>
        </div>

      </div>
    `;
    const commentBox = document.createElement("div");
commentBox.id = `comment-${doc.id}`;
div.appendChild(commentBox);

db.collection("posts")
  .doc(doc.id)
  .collection("comments")
  .orderBy("timestamp", "asc")
  .onSnapshot(snap => {

    commentBox.innerHTML = "";

    snap.forEach(cdoc => {
      const c = cdoc.data();

      const commentEl = document.createElement("div");
commentEl.className = "comment";

commentEl.innerHTML = `
  <div class="avatar" style="background-image:url('${c.avatar || ""}')"></div>

  <div>
    <div class="bubble">
      <b>${c.user}</b><br>
      ${escapeHTML(c.text)}
    </div>

    <div class="actions">
      <span onclick="showReplyInput('${doc.id}','${cdoc.id}')">💬 Balas</span>
      <span onclick="deleteCommentNew('${doc.id}','${cdoc.id}')">🗑 Hapus</span>
    </div>

    <div id="reply-${doc.id}-${cdoc.id}" style="display:none;">
      <input id="r-${doc.id}-${cdoc.id}" placeholder="Balas komentar...">
      <button onclick="addReply('${doc.id}','${cdoc.id}')">➤</button>
    </div>

    <div id="replyList-${doc.id}-${cdoc.id}" style="margin-left:30px;"></div>
  </div>
`;

commentBox.appendChild(commentEl);
      const replyBox = document.getElementById(`replyList-${doc.id}-${cdoc.id}`);
      if (!replyBox) return; 
db.collection("posts")
  .doc(doc.id)
  .collection("comments")
  .doc(cdoc.id)
  .collection("replies")
  .orderBy("timestamp","asc")
  .onSnapshot(rsnap => {

    if (replyBox) replyBox.innerHTML = "";

    rsnap.forEach(rdoc => {
      const r = rdoc.data();

      if (replyBox)replyBox.innerHTML += `
        <div class="comment">
          <div class="avatar" style="background-image:url('${r.avatar || ""}')"></div>

          <div>
            <div class="bubble">
              <b>${r.user}</b><br>
              ${escapeHTML(r.text)}
            </div>
          </div>
        </div>
      `;
    });
  });
    });
  });

    feed.appendChild(div);
  });
}


// REALTIME
db.collection('posts').orderBy('timestamp','desc')
.onSnapshot(snap => renderFeed(snap.docs));

// POST
async function createPost(e){
  const btn = e.target;
  btn.disabled = true;
  btn.innerText = "Posting...";
  const user = localStorage.getItem('username') || 'Anon';
  const avatar = localStorage.getItem('avatar') || '';
  const content = document.getElementById('content').value;

  const fileInput = document.getElementById('file');
  const file = fileInput.files[0];

  if(!content && !file){
    btn.disabled = false;
    return;
  }

  let fileUrl = null;

  if(file){
    fileUrl = await uploadToCloudinary(file);
  }

  await db.collection('posts').add({
    user,
    content,
    avatar,
    fileUrl,   // ✅ ini yang dipakai renderFeed kamu
    likes: [],
    comments: [],
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  });

  document.getElementById('content').value = '';
  fileInput.value = ''; // reset file
  btn.disabled = false;
  btn.innerText = "Posting";
}
// LIKE
async function toggleLike(id){
  const user = localStorage.getItem('username') || 'Anon';
  const ref = db.collection('posts').doc(id);

  await db.runTransaction(async t=>{
    const doc = await t.get(ref);
    let likes = doc.data().likes || [];

    if(likes.includes(user)){
      likes = likes.filter(u=>u!==user);
    } else {
      likes.push(user);
    }

    t.update(ref,{likes});
  });
}

// DELETE
async function deletePost(id){
  const currentUser = localStorage.getItem('username');
  const role = localStorage.getItem('role');

  const doc = await db.collection('posts').doc(id).get();
  const data = doc.data();

  const isAdmin = role === 'admin';

  if(data.user !== currentUser && !isAdmin){
    alert("❌ Tidak boleh hapus");
    return;
  }

  if(confirm('Hapus?')){
    await db.collection('posts').doc(id).delete();
  }
}
// ADD COMMENT
async function addComment(postId){
  const avatar = localStorage.getItem('avatar') || '';
  const input = document.getElementById('c' + postId);
  const text = input.value.trim();
  if(!text) return;

  const user = localStorage.getItem('username') || 'Anon';

  await db.collection('posts')
    .doc(postId)
    .collection('comments')
    .add({
      user,
      avatar,
      text,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });

  input.value = '';
}
// DELETE COMMENT

async function deleteCommentNew(postId, commentId){
  await db.collection("posts")
    .doc(postId)
    .collection("comments")
    .doc(commentId)
    .delete();
}

// SHOW REPLY INPUT
function showReplyInput(postId, i){
  const el = document.getElementById(`reply-${postId}-${i}`);
  if(el) el.style.display = el.style.display === 'block' ? 'none' : 'block';
}



// ADD REPLY
async function addReply(postId, commentId){
  const input = document.getElementById(`r-${postId}-${commentId}`);
  const text = input.value.trim();
  if(!text) return;

  await db.collection("posts")
    .doc(postId)
    .collection("comments")
    .doc(commentId)
    .collection("replies")
    .add({
      user: localStorage.getItem('username') || 'Anon',
      avatar: localStorage.getItem('avatar') || '',
      text,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });

  input.value = "";
  document.getElementById(`reply-${postId}-${commentId}`).style.display = "none";
}

// SETTINGS
function openSettings(){
  document.getElementById('settingsBox').style.display='flex';
  document.getElementById('setName').value = localStorage.getItem('username') || '';
}
function closeSettings(){
  document.getElementById('settingsBox').style.display='none';
}
async function saveSettings(){
  const name = document.getElementById('setName').value;
  const file = document.getElementById('setAvatar').files[0];

  if(!name.trim()){
    alert("Isi nama dulu");
    return;
  }

  let avatarUrl = localStorage.getItem('avatar') || '';

  if(file){
    avatarUrl = await uploadToCloudinary(file);
    localStorage.setItem('avatar', avatarUrl);
  }

  localStorage.setItem('username', name);

  closeSettings();
  location.reload();
}

document.getElementById("file").addEventListener("change", function(){
  const file = this.files[0];
  const info = document.getElementById("fileInfo");

  if(file){
    info.innerText = "📎 " + file.name;
  } else {
    info.innerText = "";
  }
});

function removeAvatar(){
  localStorage.removeItem('avatar');
  localStorage.removeItem('username');

  alert("Avatar & nama dihapus");

  location.reload();
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(registrations) {
    for (let registration of registrations) {
      registration.unregister();
    }
  });
}
</script>

</script>
