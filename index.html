async function uploadToCloudinary(file){

  let uploadFile = file;

  // ✅ compress hanya kalau image
  if(file.type.startsWith("image/")){

  }

  const formData = new FormData();
  formData.append("file", uploadFile);
  formData.append("upload_preset", "mini_fb_avatar");

const isVideo = file.type.startsWith("video");
  const resourceType = isVideo ? "video" : "image";


  const res = await fetch(`https://api.cloudinary.com/v1_1/dutbbao5r/${resourceType}/upload`, {
    method: "POST",
    body: formData
  });

  const data = await res.json();
  return data.secure_url.replace("/upload/", "/upload/q_auto,f_auto/");
}
  // compres
function compressImage(file, quality = 0.7, maxWidth = 1280){
  return new Promise((resolve) => {
    const reader = new FileReader();

    reader.onload = function(e){
      const img = new Image();

      img.onload = function(){
        const canvas = document.createElement("canvas");

        const scale = Math.min(maxWidth / img.width, 1);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        canvas.toBlob((blob) => {
          resolve(blob);
        }, "image/jpeg", quality);
      };

      img.src = e.target.result;
    };

    reader.readAsDataURL(file);
  });
}

// CARD FILM
function getVideoData(text) {

  const urlRegex = /(https?:\/\/[^\s]+)/g;
  const urls = text.match(urlRegex);
  if (!urls) return null;

  for (let url of urls) {

    // 🔵 YOUTUBE
    if (url.includes("youtube.com/watch") || url.includes("youtu.be/")) {
      let id = null;

      try {
        if (url.includes("youtube.com/watch")) {
          const params = new URL(url).searchParams;
          id = params.get("v");
        }

        if (url.includes("youtu.be/")) {
          id = url.split("youtu.be/")[1].split(/[?&]/)[0];
        }

        if (id) {
          return {
            type: "youtube",
            src: id
          };
        }

      } catch (e) {}
    }

    // 🟢 MP4 / VIDEO FILE
    if (url.match(/\.(mp4|webm|ogg)(\?.*)?$/)) {
      return {
        type: "video",
        src: url
      };
    }
  }

  return null;
}

function renderContent(text){

  const video = getVideoData(text);
  const safeText = escapeHTML(text);

  let html = `<div class="post-text">${safeText}</div>`;

  if (video) {

    let thumb = "";

    if (video.type === "youtube") {
      thumb = `https://img.youtube.com/vi/${video.src}/hqdefault.jpg`;
    } else {
      thumb = ""; // optional custom thumbnail
    }

    html += `
      <div class="post-video" 
           data-type="${video.type}" 
           data-src="${video.src}">
           
        ${thumb ? `<img src="${thumb}" loading="lazy">` : `<div class="video-placeholder">▶ Video</div>`}
        <div class="play-overlay">▶</div>

      </div>
    `;
  }

  return html;
}

async function toggleLike(id){
  const user = auth.currentUser;

  if(!user){
    alert("Login dulu!");
    return;
  }

  const userId = user.uid; // paling aman (unik)
  const ref = db.collection('posts').doc(id);

  await db.runTransaction(async (t) => {
    const docSnap = await t.get(ref);
    let likes = docSnap.data().likes || [];

    if(likes.includes(userId)){
      likes = likes.filter(u => u !== userId);
    } else {
      likes.push(userId);
    }

    t.update(ref, { likes });
  });
}

let pc;
let localStream;
window.currentLiveRoomId = null;
window.isLiveActive = false;
let liveConnections = {};
let pendingCandidates = [];
let liveUnsubscribes = [];
function waitVideoAndPlay(roomId, videoId, retry = 0) {
  const video = document.getElementById(videoId);

  if (video) {
    console.log("✅ VIDEO SIAP");
    autoWatchLive(roomId, videoId);
    return;
  }

  if (retry > 50) {

    return;
  }

  }, 200);
}

function waitIceGathering(pc) {
  return new Promise(resolve => {
    if (pc.iceGatheringState === "complete") {
      resolve();
      return;
    }

    const check = () => {
      if (pc.iceGatheringState === "complete") {
        pc.removeEventListener("icegatheringstatechange", check);
        resolve();
      }
    };

    pc.addEventListener("icegatheringstatechange", check);
  });
}
async function startLiveLow() {
  const user = auth.currentUser;
  if (!user) return alert("Login dulu");

  const roomId = "room_" + user.uid;
  window.currentLiveRoomId = roomId;
  window.isLiveActive = true;

  const roomRef = db.collection("liveRooms").doc(roomId);

  await roomRef.set({
    host: user.uid,
    active: true,
    createdAt: Date.now()
  });

  // camera
  localStream = await navigator.mediaDevices.getUserMedia({
    video: { width: 320, height: 240, frameRate: 10 },
    audio: true
  });
  const localVideo = document.getElementById("localVideo");
  localVideo.srcObject = localStream;
localVideo.style.display = "block";
  pc = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
  });

  localStream.getTracks().forEach(track => {
    pc.addTrack(track, localStream);
  });

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      roomRef.collection("callerCandidates").add(e.candidate.toJSON());
    }
  };

  // 🔥 FIX: OFFER HARUS SET LOCAL DULU
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await waitIceGathering(pc);

  await roomRef.update({
    offer: pc.localDescription.toJSON()
  });

  console.log("📤 OFFER SENT");

  // 🔥 FIX ANSWER LISTENER (ANTI LOOP)
  let answered = false;

  roomRef.onSnapshot(async snap => {
    const data = snap.data();
    if (!data?.answer || answered) return;

    answered = true;

    await pc.setRemoteDescription(
      new RTCSessionDescription(data.answer)
    );

    console.log("✅ ANSWER SET");
  });

  // 🔥 FIX ICE
  roomRef.collection("calleeCandidates").onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === "added") {
        const c = new RTCIceCandidate(change.doc.data());

        if (pc.remoteDescription) {
          pc.addIceCandidate(c);
        } else {
          pendingCandidates.push(c);
        }
      }
    });
  });
}
async function autoWatchLive(roomId, videoId) {

  if (liveConnections[videoId]) {
    console.log("⛔ SUDAH CONNECT:", videoId);
    return;
  }

  liveConnections[videoId] = true;

  console.log("👀 CONNECT LIVE:", videoId);

  const video = document.getElementById(videoId);
  if (!video) return;

  const pc = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
  });

  let remoteStream = new MediaStream();
let started = false;

pc.ontrack = (event) => {
  console.log("🎥 TRACK MASUK:", event.track.kind);

  remoteStream.addTrack(event.track);

  // 🔥 HANYA SET SEKALI
  if (!started) {
    started = true;

    video.srcObject = remoteStream;

    video.muted = true;
    video.autoplay = true;
    video.playsInline = true;

    video.onloadedmetadata = () => {
      video.play()
        .then(() => console.log("▶️ PLAY OK"))
        .catch(e => console.log("PLAY ERROR", e));
    };
  }
};
  pc.onicecandidate = (e) => {
    if (e.candidate) {
      db.collection("liveRooms")
        .doc(roomId)
        .collection("calleeCandidates")
        .add(e.candidate.toJSON());
    }
  };

  const roomRef = db.collection("liveRooms").doc(roomId);

  let answered = false;

  const unsub = roomRef.onSnapshot(async snap => {
    const data = snap.data();

    if (!data?.offer || answered) return;

    answered = true;

    await pc.setRemoteDescription(
      new RTCSessionDescription(data.offer)
    );

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    await roomRef.update({
      answer: pc.localDescription.toJSON()
    });

    console.log("📤 ANSWER SENT");

    unsub();
  });

  roomRef.collection("callerCandidates").onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === "added") {
        pc.addIceCandidate(
          new RTCIceCandidate(change.doc.data())
        );
      }
    });
  });
}

async function stopLive() {
  console.log("🛑 STOP LIVE DIPANGGIL");

  window.isLiveActive = false;

  // 🔥 MATIKAN ROOM
  if (window.currentLiveRoomId) {
    await db.collection("liveRooms")
      .doc(window.currentLiveRoomId)
      .update({ active: false });

    // 🔥 matikan status live di post
    const snap = await db.collection("posts")
      .where("roomId", "==", window.currentLiveRoomId)
      .get();

    snap.forEach(doc => {
      doc.ref.update({ isLive: false });
    });
  }

  // 🔥 STOP SEMUA TRACK (INI PALING PENTING)
  if (localStream) {
    localStream.getTracks().forEach(track => {
      track.stop();               // ⛔ stop kamera & mic
    });
    localStream = null;
  }

  // 🔥 MATIKAN VIDEO LOCAL
  const localVideo = document.getElementById("localVideo");
  if (localVideo) {
    localVideo.pause();
    localVideo.srcObject = null;
    localVideo.removeAttribute("src");
    localVideo.load();
    localVideo.style.display = "none";
  }

  // 🔥 CLOSE PEER CONNECTION (WAJIB)
  if (pc) {
    pc.getSenders().forEach(sender => {
      if (sender.track) sender.track.stop(); // extra safety
    });

    pc.ontrack = null;
    pc.onicecandidate = null;

    pc.close();
    pc = null;
  }

  // 🔥 RESET ROOM ID
  window.currentLiveRoomId = null;

  console.log("✅ KAMERA BENAR2 MATI");
}
