// CARD FILM
function getVideoData(text) {

  const urlRegex = /(https?:\/\/[^\s]+)/g;
  const urls = text.match(urlRegex);
  if (!urls) return null;

  for (let url of urls) {

    // 🔵 YOUTUBE
    if (url.includes("youtube.com/watch") || url.includes("youtu.be/")) {
      let id = null;

      try {
        if (url.includes("youtube.com/watch")) {
          const params = new URL(url).searchParams;
          id = params.get("v");
        }

        if (url.includes("youtu.be/")) {
          id = url.split("youtu.be/")[1].split(/[?&]/)[0];
        }

        if (id) {
          return {
            type: "youtube",
            src: id
          };
        }

      } catch (e) {}
    }

    // 🟢 MP4 / VIDEO FILE
    if (url.match(/\.(mp4|webm|ogg)(\?.*)?$/)) {
      return {
        type: "video",
        src: url
      };
    }
  }

  return null;
}

/* =========================
   OBSERVER (ANTI BLANK FIX)
========================= */
function stopVideo(el){
  if(!el) return;

  const iframe = el.querySelector("iframe");
  const video = el.querySelector("video");

  if (iframe) iframe.remove();
  if (video) {
    video.pause();
    video.src = "";
  }

  el.dataset.loaded = "0";
}

const observer = new IntersectionObserver(entries => {

  entries.forEach(entry => {

    const el = entry.target;
    const type = el.dataset.type;
    const src = el.dataset.src;

    if (!src) return;

    // =========================
    // ENTER VIEWPORT
    // =========================
    if (entry.isIntersecting) {

      // stop previous video (tapi jangan ganggu play yang masih proses)
      if (currentPlaying && currentPlaying !== el) {
        setTimeout(() => {
          stopVideo(currentPlaying);
        }, 150);
      }

      el.innerHTML = "";

      // 🔵 YOUTUBE
       if (type === "youtube") {
        const iframe = document.createElement("iframe");
        iframe.src = `https://www.youtube.com/embed/${src}?autoplay=1&mute=1&playsinline=1&rel=0`;
        iframe.allow = "autoplay; encrypted-media";
        el.appendChild(iframe);
      
      }

      // 🟢 VIDEO (MP4)
      if (type === "video") {

        // abort previous lifecycle kalau ada
        if (el._videoController) {
          el._videoController.abort();
        }

        const controller = new AbortController();
        el._videoController = controller;

        const video = document.createElement("video");

        video.src = src;
        video.muted = true;
        video.playsInline = true;
        video.controls = true;
        video.preload = "none";

        el.replaceChildren(video);

        video.load();

        requestAnimationFrame(() => {

          if (controller.signal.aborted) return;

          video.play()
            .then(() => {
              // 🔥 set active ONLY after success play
              currentPlaying = el;
            })
            .catch(err => {
              console.log("PLAY ERROR:", err);
            });
        });
      }

    }

    // =========================
    // EXIT VIEWPORT
    // =========================
    else {

      if (currentPlaying === el) {

        // kasih delay kecil biar gak bentrok sama play()
        setTimeout(() => {
          stopVideo(el);
        }, 150);

        currentPlaying = null;
      }
    }

  });

}, {
  threshold: 0.3,
  rootMargin: "150px 0px"
});

function initVideoObserver(){
  document.querySelectorAll(".post-video").forEach(el => {
    if (!el.dataset.observed) {
      observer.observe(el);
      el.dataset.observed = "1";
    }
  });
}

document.addEventListener("DOMContentLoaded", initVideoObserver);


function renderContent(text){

  const video = getVideoData(text);
  const safeText = escapeHTML(text);

  let html = `<div class="post-text">${safeText}</div>`;

  if (video) {

    let thumb = "";

    if (video.type === "youtube") {
      thumb = `https://img.youtube.com/vi/${video.src}/hqdefault.jpg`;
    } else {
      thumb = ""; // optional custom thumbnail
    }

    html += `
      <div class="post-video" 
           data-type="${video.type}" 
           data-src="${video.src}">
           
        ${thumb ? `<img src="${thumb}" loading="lazy">` : `<div class="video-placeholder">▶ Video</div>`}
        <div class="play-overlay">▶</div>

      </div>
    `;
  }

  return html;
}

  }

    displayName: name,
