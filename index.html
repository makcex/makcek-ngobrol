async function uploadToCloudinary(file){

  let uploadFile = file;

  // ✅ compress hanya kalau image
  if(file.type.startsWith("image/")){
    uploadFile = await compressImage(file, 0.7, 1280);
  }

  const formData = new FormData();
  formData.append("file", uploadFile);
  formData.append("upload_preset", "mini_fb_avatar");

  const res = await fetch("https://api.cloudinary.com/v1_1/dutbbao5r/upload", {
    method: "POST",
    body: formData
  });

  const data = await res.json();
  return data.secure_url;
}
  // compres
function compressImage(file, quality = 0.7, maxWidth = 1280){
  return new Promise((resolve) => {
    const reader = new FileReader();

    reader.onload = function(e){
      const img = new Image();

      img.onload = function(){
        const canvas = document.createElement("canvas");

        const scale = Math.min(maxWidth / img.width, 1);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        canvas.toBlob((blob) => {
          resolve(blob);
        }, "image/jpeg", quality);
      };

      img.src = e.target.result;
    };

    reader.readAsDataURL(file);
  });
}

// LIKE
async function toggleLike(id){
  const user = auth.currentUser;

  if(!user){
    alert("Login dulu!");
    return;
  }

  const userId = user.uid; // paling aman (unik)
  const ref = db.collection('posts').doc(id);

  await db.runTransaction(async (t) => {
    const docSnap = await t.get(ref);
    let likes = docSnap.data().likes || [];

    if(likes.includes(userId)){
      likes = likes.filter(u => u !== userId);
    } else {
      likes.push(userId);
    }

    t.update(ref, { likes });
  });
}
// DELETE
async function deletePost(id){
  const currentUser = auth.currentUser;
  const docSnap = await db.collection('posts').doc(id).get();
  const data = docSnap.data();

  const isAdmin = window.isAdmin === true;
  const isOwner = currentUser && data.uid === currentUser.uid;

  if(!isAdmin && !isOwner){
    alert("❌ Tidak boleh hapus");
    return;
  }

  if(confirm('Hapus?')){
    await db.collection('posts').doc(id).delete();
  }
}
