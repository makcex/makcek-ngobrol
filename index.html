async function uploadToCloudinary(file){

  let uploadFile = file;

  // ✅ compress hanya kalau image
  if(file.type.startsWith("image/")){
    uploadFile = await compressImage(file, 0.7, 1280);
  }

  const formData = new FormData();
  formData.append("file", uploadFile);
  formData.append("upload_preset", "mini_fb_avatar");

const isVideo = file.type.startsWith("video");
  const resourceType = isVideo ? "video" : "image";


  const res = await fetch(`https://api.cloudinary.com/v1_1/dutbbao5r/${resourceType}/upload`, {
    method: "POST",
    body: formData
  });

  const data = await res.json();
  return data.secure_url.replace("/upload/", "/upload/q_auto,f_auto/");
}
  // compres
function compressImage(file, quality = 0.7, maxWidth = 1280){
  return new Promise((resolve) => {
    const reader = new FileReader();

    reader.onload = function(e){
      const img = new Image();

      img.onload = function(){
        const canvas = document.createElement("canvas");

        const scale = Math.min(maxWidth / img.width, 1);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        canvas.toBlob((blob) => {
          resolve(blob);
        }, "image/jpeg", quality);
      };

      img.src = e.target.result;
    };

    reader.readAsDataURL(file);
  });
}

function loadCommentsPage(postId, box, user){

  const state = commentState[postId];
  if(!state || state.loading || !state.hasMore) return;

  state.loading = true;

  let query = db.collection("posts")
    .doc(postId)
    .collection("comments")
    .orderBy("timestamp", "desc")
    .limit(state.limit);

  if(state.lastDoc){
    query = query.startAfter(state.lastDoc);
  }

  query.get().then(snap => {

    if(snap.empty){
      state.hasMore = false;
      state.loading = false;
      return;
    }

    state.lastDoc = snap.docs[snap.docs.length - 1];
    state.hasMore = snap.docs.length === state.limit;

    snap.forEach(doc => {

      const c = doc.data();
      const commentId = doc.id;

      if(document.getElementById(`comment-${commentId}`)) return;

// CARD FILM
function getVideoData(text) {

  const urlRegex = /(https?:\/\/[^\s]+)/g;
  const urls = text.match(urlRegex);
  if (!urls) return null;

  for (let url of urls) {

    // 🔵 YOUTUBE
    if (url.includes("youtube.com/watch") || url.includes("youtu.be/")) {
      let id = null;

      try {
        if (url.includes("youtube.com/watch")) {
          const params = new URL(url).searchParams;
          id = params.get("v");
        }

        if (url.includes("youtu.be/")) {
          id = url.split("youtu.be/")[1].split(/[?&]/)[0];
        }

        if (id) {
          return {
            type: "youtube",
            src: id
          };
        }

      } catch (e) {}
    }

    // 🟢 MP4 / VIDEO FILE
    if (url.match(/\.(mp4|webm|ogg)(\?.*)?$/)) {
      return {
        type: "video",
        src: url
      };
    }
  }

  return null;
}

function renderContent(text){

  const video = getVideoData(text);
  const safeText = escapeHTML(text);

  let html = `<div class="post-text">${safeText}</div>`;

  if (video) {

    let thumb = "";

    if (video.type === "youtube") {
      thumb = `https://img.youtube.com/vi/${video.src}/hqdefault.jpg`;
    } else {
      thumb = ""; // optional custom thumbnail
    }

    html += `
      <div class="post-video" 
           data-type="${video.type}" 
           data-src="${video.src}">
           
        ${thumb ? `<img src="${thumb}" loading="lazy">` : `<div class="video-placeholder">▶ Video</div>`}
        <div class="play-overlay">▶</div>

      </div>
    `;
  }

  return html;
}

/* =========================
   OBSERVER (ANTI BLANK FIX)
========================= */
function stopVideo(el){
  if(!el) return;

  const iframe = el.querySelector("iframe");
  const video = el.querySelector("video");

  if (iframe) iframe.remove();
  if (video) {
    video.pause();
    video.src = "";
  }

  el.dataset.loaded = "0";
}

const observer = new IntersectionObserver(entries => {

  entries.forEach(entry => {

    const el = entry.target;
    const type = el.dataset.type;
    const src = el.dataset.src;

    if (!src) return;

    // =========================
    // ENTER VIEWPORT
    // =========================
    if (entry.isIntersecting) {

      // stop previous video (tapi jangan ganggu play yang masih proses)
      if (currentPlaying && currentPlaying !== el) {
        setTimeout(() => {
          stopVideo(currentPlaying);
        }, 150);
      }

      el.innerHTML = "";

      // 🔵 YOUTUBE
       if (type === "youtube") {
        const iframe = document.createElement("iframe");
        iframe.src = `https://www.youtube.com/embed/${src}?autoplay=1&mute=1&playsinline=1&rel=0`;
        iframe.allow = "autoplay; encrypted-media";
        el.appendChild(iframe);
      
      }

      // 🟢 VIDEO (MP4)
      if (type === "video") {

        // abort previous lifecycle kalau ada
        if (el._videoController) {
          el._videoController.abort();
        }

        const controller = new AbortController();
        el._videoController = controller;

        const video = document.createElement("video");

        video.src = src;
        video.muted = true;
        video.playsInline = true;
        video.controls = true;
        video.preload = "auto";

        el.replaceChildren(video);

        video.load();

        requestAnimationFrame(() => {

          if (controller.signal.aborted) return;

          video.play()
            .then(() => {
              // 🔥 set active ONLY after success play
              currentPlaying = el;
            })
            .catch(err => {
              console.log("PLAY ERROR:", err);
            });
        });
      }

    }

    // =========================
    // EXIT VIEWPORT
    // =========================
    else {

      if (currentPlaying === el) {

        // kasih delay kecil biar gak bentrok sama play()
        setTimeout(() => {
          stopVideo(el);
        }, 150);

        currentPlaying = null;
      }
    }

  });

}, {
  threshold: 0.3,
  rootMargin: "150px 0px"
});

function showClickToPlay(el, video){

function initVideoObserver(){
  document.querySelectorAll(".post-video").forEach(el => {
    if (!el.dataset.observed) {
      observer.observe(el);
      el.dataset.observed = "1";
    }
  });
}

document.addEventListener("DOMContentLoaded", initVideoObserver);

// LIKE
async function toggleLike(id){
  const user = auth.currentUser;

  if(!user){
    alert("Login dulu!");
    return;
  }

  const userId = user.uid; // paling aman (unik)
  const ref = db.collection('posts').doc(id);

  await db.runTransaction(async (t) => {
    const docSnap = await t.get(ref);
    let likes = docSnap.data().likes || [];

    if(likes.includes(userId)){
      likes = likes.filter(u => u !== userId);
    } else {
      likes.push(userId);
    }

    t.update(ref, { likes });
  });
}

window.onload = function(){

  let searchTimer;
  const movieCache = {};

  document.getElementById("search").addEventListener("input", function(){

    clearTimeout(searchTimer);

    searchTimer = setTimeout(async () => {

      const keyword = this.value.trim() || "movie";
      const box = document.getElementById("movieList");

      box.innerHTML = "⏳ Cari film...";

      try{

        // 🔥 CACHE HIT (hemat API)
        if(movieCache[keyword]){
          renderList(movieCache[keyword], box);
          return;
        }

        const res = await fetch(
          `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${keyword}+movie&type=video&videoDuration=long&maxResults=20&key=${YT_API_KEY}`
        );

        const data = await res.json();

        movieCache[keyword] = data.items;

        renderList(data.items, box);

      } catch(e){
        box.innerHTML = "❌ Gagal cari film";
      }

    }, 700); // ⏱ delay biar gak spam API

  });


  // 🔥 pisahin render biar clean
  function renderList(items, box){
    box.innerHTML = "";

    items.forEach(v => {
      const id = v.id.videoId;
      const title = v.snippet.title;
      const img = v.snippet.thumbnails.medium.url;

      box.innerHTML += `
        <div onclick="playMovie('${id}')"
          style="display:flex;gap:10px;padding:10px;border-bottom:1px solid #ddd;cursor:pointer;align-items:center;">
          
          <img src="${img}" style="width:80px;border-radius:8px;" alt="movie">
          
          <div>🎬 ${title}</div>
        </div>
      `;
    });
  }

}

}

function listenViewers(roomId) {

  db.collection("liveRooms")
    .doc(roomId)
    .collection("viewers")
    .onSnapshot(snapshot => {

      console.log("👀 VIEWER UPDATE:", snapshot.size);

      window.liveState.viewerCount = snapshot.size;
      updateLiveUI();

      snapshot.docChanges().forEach(change => {

        if (change.type === "added") {
          console.log("➕ VIEWER MASUK:", change.doc.id);

          handleViewer(change.doc.id, change.doc.ref);
        }

        if (change.type === "removed") {
          console.log("➖ VIEWER KELUAR:", change.doc.id);
        }

      });

    }, error => {
      console.log("❌ LISTENER ERROR:", error);
    });
}
async function handleViewer(viewerId, viewerRef) {

  console.log("⚡ HANDLE VIEWER:", viewerId);

  if (window.liveState.pcs[viewerId]) return;

  const stream = window.liveState.stream;

  if (!stream) {
    console.log("❌ STREAM BELUM READY");
    return;
  }

  const pc = new RTCPeerConnection(iceServers);
  window.liveState.pcs[viewerId] = pc;

  // kirim stream ke viewer
  stream.getTracks().forEach(track => {
    pc.addTrack(track, stream);
  });

  // ICE host → viewer
  pc.onicecandidate = (e) => {
    if (e.candidate) {
      viewerRef.collection("hostCandidates").add(e.candidate.toJSON());
    }
  };

  let buffer = [];

  // ICE viewer → host
  viewerRef.collection("viewerCandidates")
    .onSnapshot(snap => {
      snap.docChanges().forEach(change => {
        if (change.type === "added") {
          const c = new RTCIceCandidate(change.doc.data());

          if (!pc.remoteDescription) {
            buffer.push(c);
          } else {
            pc.addIceCandidate(c).catch(console.error);
          }
        }
      });
    });

  // OFFER
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await viewerRef.set({
    offer: pc.localDescription.toJSON()
  });
  console.log("📡 OFFER SENT:", pc.localDescription);

  // ANSWER (FIXED)
  viewerRef.onSnapshot(async snap => {
    const data = snap.data();

    if (data?.answer && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(
        new RTCSessionDescription(data.answer)
      );

      // flush ICE
      buffer.forEach(c => pc.addIceCandidate(c).catch(console.error));
      buffer = [];
    }
  });

  // cleanup
  pc.onconnectionstatechange = () => {
    if (["failed", "closed", "disconnected"].includes(pc.connectionState)) {
      delete window.liveState.pcs[viewerId];
    }
  };
}

async function joinRoom(roomId) {

  console.log("📱 JOIN ROOM:", roomId);

  const pc = new RTCPeerConnection(iceServers);

  // 🔥 TERIMA VIDEO DARI HOST
  pc.ontrack = (event) => {
    console.log("🎥 STREAM MASUK");

    let video = document.querySelector("#remoteVideo");

    if (!video) {
      video = document.createElement("video");
      video.id = "remoteVideo";
      video.autoplay = true;
      video.playsInline = true;
      video.controls = true;
      document.body.appendChild(video);
    }

    video.srcObject = event.streams[0];
  };

  // 🔄 ICE VIEWER → HOST
  pc.onicecandidate = (e) => {
    if (e.candidate) {
      db.collection("liveRooms")
        .doc(roomId)
        .collection("viewerCandidates")
        .add(e.candidate.toJSON());
    }
  };

  // 📦 BUAT VIEWER DOC
  const viewerRef = db.collection("liveRooms")
    .doc(roomId)
    .collection("viewers")
    .doc();

  await viewerRef.set({
    createdAt: Date.now()
  });

  // 📩 TERIMA OFFER DARI HOST
  viewerRef.onSnapshot(async snap => {
    const data = snap.data();

    if (data?.offer && !pc.currentRemoteDescription) {

      console.log("📩 TERIMA OFFER");

      await pc.setRemoteDescription(
        new RTCSessionDescription(data.offer)
      );

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      await viewerRef.update({
        answer: pc.localDescription.toJSON()
      });

      console.log("📤 ANSWER TERKIRIM");
    }
  });

  // 🔄 TERIMA ICE DARI HOST
  db.collection("liveRooms")
    .doc(roomId)
    .collection("hostCandidates")
    .onSnapshot(snapshot => {
      snapshot.docChanges().forEach(change => {
        if (change.type === "added") {
          pc.addIceCandidate(
            new RTCIceCandidate(change.doc.data())
          ).catch(console.error);
        }
      });
    });

  console.log("📡 VIEWER READY");
}

async function stopLive() {

  console.log("🛑 STOP LIVE DIJALANKAN");

  window.liveState.isLive = false;

  const roomId = window.liveState.roomId;

  // 🔥 update Firestore
  if (roomId) {
    await db.collection("liveRooms")
      .doc(roomId)
      .update({ active: false }, { merge: true });
  }

  // 🔥 STOP CAMERA STREAM
  if (window.localStream) {
    window.localStream.getTracks().forEach(track => {
      track.stop();
    });
    window.localStream = null;
  }

  if (window.liveState.stream) {
    window.liveState.stream.getTracks().forEach(track => {
      track.stop();
    });
    window.liveState.stream = null;
  }

  // 🔥 CLOSE ALL PEER CONNECTIONS
  Object.values(window.liveState.pcs).forEach(pc => {
    try {
      pc.close();
    } catch (e) {}
  });

  window.liveState.pcs = {};

  // 🔥 RESET STATE
  window.liveState.roomId = null;
  window.liveState.viewerCount = 0;

  // 🔥 HAPUS UI BIAR CLEAR
  const el = document.getElementById("live-container");
  if (el) el.remove();

  updateLiveUI();

  console.log("✅ LIVE SUDAH STOP TOTAL");
}
